name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      # uv installs standalone CPython builds, which exist for every supported version on any runner
      # image (actions/setup-python has no 3.9 build for Ubuntu 26.04).
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - run: uv pip install -e '.[dev]'
      - run: pytest -q
      - name: tests also pass with the stdlib HTML parser (what lineage.pyz uses)
        run: LINEAGE_HTML_PARSER=html.parser pytest -q
  build-pyz:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true
      - run: uv pip install pip
      - run: scripts/build_pyz.sh
      - name: the single-file app runs on the oldest supported Python, with no packages installed
        run: |
          uv python install 3.9
          PY39="$(uv python find 3.9)"
          env -i PATH=/usr/bin:/bin HOME="$HOME" "$PY39" dist/lineage.pyz --help
          env -i PATH=/usr/bin:/bin HOME="$HOME" "$PY39" dist/lineage.pyz \
            --render tests/fixtures/worldcrafter_2609.24984.graph.json -f html -o /tmp/check
          grep -q 'class="recipe"' /tmp/check.html
      - uses: actions/upload-artifact@v4
        with:
          name: lineage.pyz
          path: dist/lineage.pyz

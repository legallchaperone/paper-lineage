[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-lineage"
version = "0.1.1"
description = "Trace the citation-grounded lineage of an arXiv paper and render it as a mind-map."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "legallchaperone"}]
keywords = ["arxiv", "citation", "lineage", "research", "visualization", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "typer>=0.12",
  "rich>=13.0",
]

[project.optional-dependencies]
fast = ["lxml>=5.0"]
dev = ["pytest>=8", "lxml>=5.0"]

[project.urls]
Homepage = "https://github.com/legallchaperone/paper-lineage"
Issues = "https://github.com/legallchaperone/paper-lineage/issues"

[project.scripts]
lineage = "paper_lineage.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits arXiv / Semantic Scholar (skipped unless LINEAGE_NETWORK_TESTS=1)"]

[tool.setuptools.package-data]
paper_lineage = ["render/assets/*"]
